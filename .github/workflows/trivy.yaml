name: Trivy scan

on:
  workflow_call:
    inputs:
      submit_dependency_graph:
        description: "Submit SBOM to GitHub Dependency Graph"
        required: false
        type: boolean
        default: false

jobs:
  scan:
    name: Trivy scan
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install rockcraft (for skopeo)
        run: |
          sudo snap install rockcraft --classic

      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: polaris-console-${{ matrix.arch }}
          path: polaris-console

      - name: Cache Trivy DB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/trivy
          key: ${{ runner.os }}-trivy-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-trivy-

      - name: Import and unpack image
        run: |
          TAR_FILE=$(find polaris-console -type f -name "*.tar")
          rockcraft.skopeo --insecure-policy copy \
            "docker-archive:${TAR_FILE}" \
            oci:console:latest
          rockcraft.skopeo --insecure-policy copy \
            oci:console:latest \
            "docker-daemon:trivy/polaris-console-${{ matrix.arch }}:${{ github.sha }}"
          /snap/rockcraft/current/bin/umoci unpack --rootless --image console:latest extracted

      # Trivy cannot currently report CVEs from slices. Therefore, we create a SBOM file with ssbom
      # and run the scan on it, in addition to the scan on the image like we previously had.
      # To do it, we extract the filesystem so that ssbom can access the chisel manifest and the os release info.
      - name: Generate Chisel SPDX SBOM
        run: |
          go install github.com/canonical/ssbom/cmd/ssbom@latest
          "$(go env GOPATH)/bin/ssbom" extracted/rootfs "chisel.spdx.json"

      # Binary scan, pebble + any non slice package
      - name: Run Trivy image vulnerability scanner
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: "trivy/polaris-console-${{ matrix.arch }}:${{ github.sha }}"
          format: "sarif"
          output: "trivy-image-results.sarif"
          severity: "MEDIUM,HIGH,CRITICAL"
          trivyignores: .trivyignore

      - name: Upload image Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: "trivy-image-results.sarif"
          category: ${{ matrix.arch }}

      # Chisel OS slices scan (via ssbom)
      - name: Run Trivy Chisel SBOM vulnerability scanner
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: "sbom"
          scan-ref: "chisel.spdx.json"
          format: "sarif"
          output: "trivy-chisel-results.sarif"
          severity: "MEDIUM,HIGH,CRITICAL"
          trivyignores: .trivyignore

      - name: Upload Chisel Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: "trivy-chisel-results.sarif"
          category: "${{ matrix.arch }}-chisel"

      - name: Run Trivy in GitHub SBOM mode and submit image results to Dependency Graph
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        if: ${{ inputs.submit_dependency_graph }}
        with:
          scan-type: "image"
          format: "github"
          output: "dependency-results-image-${{ matrix.arch }}.sbom.json"
          image-ref: "trivy/polaris-console-${{ matrix.arch }}:${{ github.sha }}"
          github-pat: ${{ secrets.GITHUB_TOKEN }}

      - name: Submit Chisel SBOM to GitHub Dependency Graph
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        if: ${{ inputs.submit_dependency_graph }}
        with:
          scan-type: "sbom"
          scan-ref: "chisel.spdx.json"
          format: "github"
          output: "dependency-results-chisel-${{ matrix.arch }}.sbom.json"
          github-pat: ${{ secrets.GITHUB_TOKEN }}
